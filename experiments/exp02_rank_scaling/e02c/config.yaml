# ── exp02 / e02c — rank push: r=256, alpha=512 (gamma = alpha/r = 2, constant) ──
# Overrides configs/base.yaml. One knob: lora.r (alpha=2r holds effective scaling
# gamma=2 fixed, so this isolates capacity — continues exp01's monotonic-rank result
# past r=128). Vanilla LoRA (no rsLoRA; with alpha=2r, gamma is already rank-stable).
# zero_shot; effective batch 768 (8 GPU × 48 × accum 2). Judged on Kaggle test.
paths:
  saved_models: "experiments/exp02_rank_scaling/e02c/saved_models"
  output_csv: "experiments/exp02_rank_scaling/e02c/outputs/zero_shot_submission.csv"

lora:
  r: 256
  lora_alpha: 512

training:
  batch_size: 48
  grad_accumulation_steps: 2

prompting:
  strategy: "zero_shot"
