paths: {output_csv: "experiments/exp10_ensemble_combine/e10c/outputs/ll_submission.csv"}
inference: {batch_size: 32}
ensemble:
  combine: "geometric"
  members:
    - {adapter: "experiments/exp06_zeroshot_recipe/e06c/saved_models", strategy: "zero_shot", shots: 0, weight: 1.5}
    - {adapter: "experiments/exp07_eff192_ensemble/e07a/saved_models", strategy: "zero_shot", shots: 0, weight: 1.5}
    - {adapter: "experiments/exp08_fewshot_diversity/e08b/saved_models", strategy: "few_shot", shots: 2, weight: 1}
    - {adapter: "experiments/exp07_eff192_ensemble/e07b/saved_models", strategy: "few_shot", shots: 4, weight: 1}
    - {adapter: "experiments/exp08_fewshot_diversity/e08a/saved_models", strategy: "few_shot", shots: 8, weight: 1}
