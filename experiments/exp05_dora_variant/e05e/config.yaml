# ── exp05 / e05e — DoRA-in-ensemble: best + dora256 + dora192 ──
paths:
  output_csv: "experiments/exp05_dora_variant/e05e/outputs/ll_submission.csv"
inference:
  batch_size: 32
ensemble:
  members:
    - adapter: "experiments/exp02_rank_scaling/e02c/saved_models"
      strategy: "zero_shot"
    - adapter: "experiments/exp02_rank_scaling/e02b/saved_models"
      strategy: "zero_shot"
    - adapter: "experiments/exp04_strategy_diverse/e04a/saved_models"
      strategy: "few_shot"
    - adapter: "experiments/exp05_dora_variant/e05a/saved_models"
      strategy: "zero_shot"
    - adapter: "experiments/exp05_dora_variant/e05b/saved_models"
      strategy: "zero_shot"
