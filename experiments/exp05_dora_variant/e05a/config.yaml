# ── exp05 / e05a — DoRA (weight-decomposed LoRA) r=256, alpha=512, zero_shot ──
# Head-to-head vs exp02's vanilla LoRA at the same rank (e02c r256=0.7766, etc).
# DoRA loads normally onto the base -> ensemble-compatible. Effective batch 768.
paths:
  saved_models: "experiments/exp05_dora_variant/e05a/saved_models"
  output_csv: "experiments/exp05_dora_variant/e05a/outputs/zero_shot_submission.csv"
lora:
  r: 256
  lora_alpha: 512
  use_dora: true
training:
  batch_size: 8            # DoRA is memory-heavy; smaller per-GPU batch
  grad_accumulation_steps: 12  # 8 GPU × 8 × 12 = 768 effective (unchanged)
prompting:
  strategy: "zero_shot"
